services:
  flight-db:
    image: postgres:16-alpine
    container_name: flight-db
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - flight-db-data:/var/lib/postgresql/data

  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flight-service:
    build:
      context: .
      dockerfile: flightService/Dockerfile
    container_name: flight-service
    environment:
      FLIGHT_DB_HOST: flight-db
      FLIGHT_DB_PORT: "5432"
      FLIGHT_DB_NAME: flight
      FLIGHT_DB_USER: postgres
      FLIGHT_DB_PASSWORD: postgres
      GRPC_PORT: "50051"
      METRICS_PORT: "8081"
    ports:
      - "50051:50051"
      - "8081:8081"
    depends_on:
      flight-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: bookingService/Dockerfile
    container_name: booking-service
    environment:
      BOOKING_DB_HOST: booking-db
      BOOKING_DB_PORT: "5432"
      BOOKING_DB_NAME: booking
      BOOKING_DB_USER: postgres
      BOOKING_DB_PASSWORD: postgres
      FLIGHT_SERVICE_HOST: flight-service
      FLIGHT_SERVICE_PORT: "50051"
      REST_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - booking-service
      - flight-service

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  flight-db-data:
  booking-db-data: