global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["booking-service:8080"]

  - job_name: flight-service
    metrics_path: /metrics
    static_configs:
      - targets: ["flight-service:8081"]

  - job_name: booking-db
    static_configs:
      - targets: ["booking-db-exporter:9187"]

  - job_name: flight-db
    static_configs:
      - targets: ["flight-db-exporter:9187"]
