name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build all services
        run: ./gradlew build -x test --console=plain

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test --console=plain

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run integration tests
        run: ./gradlew integrationTest --console=plain

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start system
        run: docker compose up --build -d --wait

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8080/flights?origin=SVO&destination=LED" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run load test
        run: |
          mkdir -p load-test-results
          set -o pipefail
          k6 run --summary-export load-test-results/summary.json tests/load/booking-load.js \
            | tee load-test-results/k6.log

      - name: Health check after load
        if: always()
        run: curl -fsS "http://localhost:8080/flights?origin=SVO&destination=LED" >/dev/null

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results/

      - name: Stop system
        if: always()
        run: docker compose down -v
