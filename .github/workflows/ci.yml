name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build all services
        run: ./gradlew build -x test --console=plain

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test --console=plain

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run integration tests
        run: ./gradlew integrationTest --console=plain

  load-tests:
    name: E2E, Load and Metrics
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start system
        run: docker compose up --build -d --wait

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8080/flights?origin=SVO&destination=LED" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Wait for Prometheus
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:9090/-/ready" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run E2E booking flow
        run: SKIP_COMPOSE_UP=true bash tests/e2e/booking-flow.sh

      - name: Run load test and collect metrics
        run: |
          mkdir -p load-test-results
          bash tests/load/collect-prometheus-metrics.sh load-test-results/prometheus-samples.jsonl &
          PROMETHEUS_COLLECTOR_PID=$!

          set +e
          set -o pipefail
          k6 run --summary-export load-test-results/summary.json tests/load/booking-load.js \
            | tee load-test-results/k6.log
          K6_STATUS=${PIPESTATUS[0]}

          kill "$PROMETHEUS_COLLECTOR_PID" || true
          wait "$PROMETHEUS_COLLECTOR_PID" || true
          echo "$K6_STATUS" > load-test-results/k6.exitcode

      - name: Health check after load
        if: always()
        run: curl -fsS "http://localhost:8080/flights?origin=SVO&destination=LED" >/dev/null

      - name: Check Prometheus thresholds
        run: python3 tests/load/check-prometheus-metrics.py http://localhost:9090 load-test-results/prometheus-check.json

      - name: Fail if k6 thresholds failed
        if: always()
        run: |
          if [ -f load-test-results/k6.exitcode ]; then
            exit "$(cat load-test-results/k6.exitcode)"
          fi
          exit 1

      - name: Upload load and metrics results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-and-metrics-results
          path: load-test-results/

      - name: Stop system
        if: always()
        run: docker compose down -v
